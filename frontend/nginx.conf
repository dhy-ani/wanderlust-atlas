# nginx serves the built SPA and reverse-proxies the API to the backend container.
# "backend" is the service name in docker-compose.yml — Docker's internal DNS
# resolves it to the backend container's IP on the shared network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls -> backend service. The frontend uses relative /api/... URLs, so
    # in the browser everything is same-origin and CORS never comes into play.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
