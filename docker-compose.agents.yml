# ============================================================================
#  Agent-system infrastructure — additive to docker-compose.yml, not a
#  replacement. Run BOTH together:
#
#    docker compose -f docker-compose.yml -f docker-compose.agents.yml up --build
#
#  Adds Neo4j (GraphRAG) and ChromaDB (per-twin vector memory), and points the
#  backend at them. Without this file, the backend still runs fine — GraphRAG and
#  memory just use their static/keyword fallbacks (see docs/architecture-v2/).
# ============================================================================
services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_AGENT_EXTRAS: "1"   # bakes langgraph/neo4j/chromadb into the image
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TWIN_MODEL: ${TWIN_MODEL:-google/gemini-2.5-flash-lite}
      MEDIATOR_MODEL: ${MEDIATOR_MODEL:-google/gemini-2.5-flash-lite}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-wanderlust123}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_started

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-wanderlust123}
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # browser UI: http://localhost:7474
      - "7687:7687"   # bolt (used by the backend + ingestion script)
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"   # host 8001 avoids clashing with the backend's internal 8000
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped

volumes:
  neo4j-data:
  chroma-data:
